<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101214">
<meta name="color-scheme" content="dark">
<title>기울기 미로 조종기</title>
<style>
/* 손에 쥐는 조종기: 어두운 화면 하나에 큰 원판, 아래에 엄지로 누를 버튼 */
:root {
  --bg: #101214; --panel: #1a1d21; --line: #2e333a; --ink: #eceae4; --muted: #9aa0a7;
  --accent: #f08c3e; --ok: #4fc08d; --ble: #5aa8ff; --warn: #f0745c;
  --f: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f);
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 12px; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.on { color: #fff; background: var(--ble); border-color: var(--ble); }
.chip.warn { color: #fff; background: var(--warn); border-color: var(--warn); }
.stage { flex: 1; min-height: 120px; display: grid; place-items: center; container-type: size; }
.plate { position: relative; width: min(86vw, 52vh, 420px); width: min(86vw, calc(100cqh - 34px), 420px); aspect-ratio: 1; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); touch-action: none; }
.plate .ring { position: absolute; inset: 25%; border-radius: 50%; border: 1px solid var(--line); }
.plate .h, .plate .v { position: absolute; background: var(--line); }
.plate .h { left: 6%; right: 6%; top: 50%; height: 1px; }
.plate .v { top: 6%; bottom: 6%; left: 50%; width: 1px; }
.plate .front { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--accent); white-space: nowrap; }
.ball { position: absolute; width: 16%; aspect-ratio: 1; border-radius: 50%; left: 42%; top: 42%;
  background: radial-gradient(circle at 35% 30%, #fff 0 12%, #c9ced5 25%, #7d848d 75%); box-shadow: 0 3px 10px rgba(0,0,0,.5); }
.ball.max { outline: 3px solid var(--warn); outline-offset: 3px; }
.real { position: absolute; width: 9%; aspect-ratio: 1; border-radius: 50%; left: 45.5%; top: 45.5%; border: 3px solid var(--ok); opacity: 0; transition: opacity .3s; }
.real.show { opacity: 1; }
.readout { display: flex; justify-content: center; gap: 18px; font-family: var(--mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); font-weight: 500; }
.readout .g { color: var(--ok); }
.msg { font-size: 14px; line-height: 1.5; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.msg[hidden] { display: none; }
.msg { max-height: 46vh; overflow-y: auto; user-select: text; -webkit-user-select: text; }
.msg b { color: var(--ink); }
.msg ol { margin: 6px 0; padding-left: 20px; } .msg li { margin: 2px 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; font-size: 16px; font-weight: 600; min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button:active { transform: scale(.98); }
button.primary { background: var(--ble); border-color: var(--ble); color: #fff; }
button.hold[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
button[hidden] { display: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sens { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.sens input { width: 100%; accent-color: var(--accent); }
.sens output { font-family: var(--mono); color: var(--ink); min-width: 3.5em; text-align: right; }
.guide { text-align: center; font-size: 13px; color: var(--muted); text-decoration: none; padding: 2px 0 4px; }
.guide:active { color: var(--ink); }
/* 서 있는 곳 */
.side { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.side select { font: inherit; font-size: 15px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
/* 기록 */
.run { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: stretch; }
.run .clock { font-family: var(--mono); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
.run .clock small { font-size: 12px; color: var(--muted); font-weight: 400; font-family: var(--f); }
.run .clock.going { color: var(--accent); }
.run button { min-width: 92px; padding: 0 14px; }
button.go { background: var(--accent); border-color: var(--accent); color: #111; }
button.finish { background: var(--ok); border-color: var(--ok); color: #0b1a12; font-size: 18px; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; font-weight: 800; color: var(--accent); text-shadow: 0 4px 20px rgba(0,0,0,.6); pointer-events: none; }
.count[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
.sheet[hidden] { display: none; }
.sheet .card { width: min(520px, 100%); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); user-select: text; -webkit-user-select: text; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.sheet .big { font-family: var(--mono); font-size: 40px; color: var(--accent); font-weight: 600; }
.sheet input { font: inherit; font-size: 20px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: r; }
.ranks li { counter-increment: r; display: grid; grid-template-columns: 2.2em 1fr auto auto; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 8px; font-size: 15px; }
.ranks li::before { content: counter(r); font-family: var(--mono); color: var(--muted); text-align: right; }
.ranks li:nth-child(-n+3)::before { color: var(--accent); font-weight: 700; }
.ranks li.me { background: rgba(240,140,62,.18); }
.ranks .t { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ranks .d { font-size: 12px; color: var(--muted); }
.ranks li.empty { grid-template-columns: 1fr; color: var(--muted); }
.ranks li.empty::before { content: none; }
</style>
</head>
<body>
<header>
  <h1>기울기 미로 조종기</h1>
  <span class="chip" id="chip">연결 안 됨</span>
</header>

<div class="msg" id="msg" hidden></div>

<div class="stage">
  <div class="plate" id="plate" aria-label="기울기 표시. 센서가 없으면 끌어서 조종">
    <span class="front">▲ 미로 쪽</span>
    <div class="h"></div><div class="v"></div><div class="ring"></div>
    <div class="real" id="real" title="실제 미로판"></div>
    <div class="ball" id="ball"></div>
    <div class="count" id="count" hidden></div>
  </div>
</div>

<div class="readout">
  <span>오른쪽 <b id="rR">0.0°</b></span>
  <span>앞쪽 <b id="rF">0.0°</b></span>
  <span class="g" id="rB">판 —</span>
</div>

<div class="run">
  <div class="clock" id="clock">00:00.0<small id="best">기록 재기: 출발점에 구슬을 놓고 시작</small></div>
  <button class="go" id="btnRun">▶ 시작</button>
  <button id="btnRank">🏆 순위</button>
</div>
<div class="side"><label for="side">서 있는 곳</label>
  <select id="side">
    <option value="plaque">QR 안내판 쪽 (미로 왼쪽)</option>
    <option value="front">출발점 쪽 (미로 앞)</option>
    <option value="right">서보 쪽 (미로 오른쪽)</option>
    <option value="back">도착점 쪽 (미로 뒤)</option>
  </select>
</div>
<div class="sens"><label for="sens">민감도</label><input id="sens" type="range" min="0.5" max="1.6" step="0.05" value="1"><output id="sensO">1.00×</output></div>

<button class="primary" id="btnConnect">미로 연결 (블루투스)</button>
<button id="btnScanAll" hidden>목록에 안 보이면: 주변 기기 전부 보기</button>
<button id="btnSensor" hidden>기울기 센서 켜기</button>
<div class="row">
  <button id="btnZero">지금 자세를 수평으로</button>
  <button class="hold" id="btnPause" aria-pressed="false">일시정지</button>
</div>
<a class="guide" href="guide/">📘 만드는 방법 · 3D 출력 파일 · 시뮬레이터</a>

<div class="sheet" id="saveSheet" hidden>
  <form class="card" id="saveForm" autocomplete="off">
    <h2>도착!</h2>
    <div class="big" id="saveTime">00:00.0</div>
    <p id="saveInfo"></p>
    <input id="nick" maxlength="10" placeholder="별명 (10글자까지)" enterkeyhint="done" aria-label="별명">
    <div class="row"><button type="submit" class="go" id="btnSave">기록 저장</button><button type="button" id="btnNoSave">저장 안 함</button></div>
  </form>
</div>
<div class="sheet" id="rankSheet" hidden>
  <div class="card">
    <h2>🏆 실제 미로 순위</h2>
    <p id="rankInfo">불러오는 중…</p>
    <ol class="ranks" id="rankList"></ol>
    <button type="button" id="btnRankClose">닫기</button>
  </div>
</div>

<script>
// ===== 미로 쪽 펌웨어(USE_BLE)와 같아야 하는 값 =====
const SERVICE = '7f1a0001-6d3c-4b2a-9e5f-1b2c3d4e5f60';
const TILT    = '7f1a0002-6d3c-4b2a-9e5f-1b2c3d4e5f60';   // 폰 → 미로: int16 오른쪽, int16 앞쪽 (0.01°), uint8 플래그
const STATUS  = '7f1a0003-6d3c-4b2a-9e5f-1b2c3d4e5f60';   // 미로 → 폰: int16 판X, int16 판Y, uint8 입력원
const SEND_HZ = 40;
const VIEW_RANGE = 25;          // 원판 가장자리 = 손 기울기 25° (미로판 약 8°)

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

let raw = null;                  // 센서 원래값 [오른쪽, 앞쪽]
let zero = store.get('zero', [0, 0]);
let sens = store.get('sens', 1);
let paused = false, dragVec = null, sensorSeen = false;
let device = null, tiltChar = null, writing = false, sentCount = 0;
let board = null, boardAt = 0;
$('sens').value = sens; $('sensO').textContent = (+sens).toFixed(2) + '×';

function say(html) { const m = $('msg'); if (!html) { m.hidden = true; return; } m.innerHTML = html; m.hidden = false; }
function chip(text, cls) { const c = $('chip'); c.textContent = text; c.className = 'chip' + (cls ? ' ' + cls : ''); }

// ===== 환경 점검 =====
const hasBLE = !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
if (!window.isSecureContext) {
  say('이 페이지는 <b>https 주소</b>로 열어야 센서와 블루투스를 쓸 수 있습니다. GitHub Pages 같은 곳에 올려서 여세요.');
} else if (!hasBLE) {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  say(ios ? '아이폰 사파리는 웹 블루투스를 지원하지 않습니다. 앱스토어의 <b>Bluefy</b> 브라우저로 이 주소를 여세요.'
          : '이 브라우저는 웹 블루투스를 지원하지 않습니다. 안드로이드는 <b>크롬</b>으로 열어 주세요.');
}

// ===== 기울기 센서 =====
// 세로로 들고, 화면 위쪽이 미로를 향하게. gamma: 오른쪽이 내려가면 +, beta: 위쪽이 내려가면 −
function screenAngle() {
  const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  return ((a % 360) + 360) % 360;
}
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  sensorSeen = true;
  const b = e.beta, g = e.gamma, a = screenAngle();
  let r, f;
  if (a === 90) { r = b; f = g; }
  else if (a === 180) { r = -g; f = b; }
  else if (a === 270) { r = -b; f = -g; }
  else { r = g; f = -b; }
  raw = [r, f];
}
function startSensor() {
  window.addEventListener('deviceorientation', onOrient);
  setTimeout(() => { if (!sensorSeen) say('기울기 센서 값이 들어오지 않습니다. 센서가 없는 기기라면 원판을 손가락으로 끌어서 조종할 수 있습니다.'); }, 1500);
}
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
  $('btnSensor').hidden = false;                       // 아이폰: 버튼을 눌러 허락받아야 함
  $('btnSensor').addEventListener('click', async () => {
    try { const r = await DeviceOrientationEvent.requestPermission(); if (r === 'granted') { $('btnSensor').hidden = true; startSensor(); } else say('기울기 센서 사용을 허락해야 조종할 수 있습니다.'); }
    catch (e) { say('센서를 켤 수 없습니다: ' + e.message); }
  });
} else startSensor();

// 센서가 없을 때(컴퓨터 등): 원판 끌기
const plate = $('plate');
function dragMove(e) {
  const r = plate.getBoundingClientRect();
  let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = -(e.clientY - r.top - r.height / 2) / (r.height / 2);
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  dragVec = [x * VIEW_RANGE, y * VIEW_RANGE];
}
plate.addEventListener('pointerdown', e => { if (sensorSeen) return; plate.setPointerCapture(e.pointerId); dragMove(e); });
plate.addEventListener('pointermove', e => { if (dragVec) dragMove(e); });
['pointerup', 'pointercancel'].forEach(t => plate.addEventListener(t, () => { dragVec = null; }));

function current() {           // 미로로 보낼 손 기울기 (°)
  if (paused) return [0, 0];
  let v = dragVec ? dragVec : raw ? [raw[0] - zero[0], raw[1] - zero[1]] : [0, 0];
  return [Math.max(-60, Math.min(60, v[0] * sens)), Math.max(-60, Math.min(60, v[1] * sens))];
}

// ===== 서 있는 곳 기준 =====
// 미로 펌웨어는 '출발점 쪽(앞, -Y)에 서서' 기준으로 [오른쪽(+X), 앞쪽(+Y)] 값을 받습니다.
// 다른 쪽에 서면 내 오른쪽·앞쪽이 미로판의 어느 방향인지 바꿔서 보냅니다.  (u_r: 내 오른쪽, u_f: 내 앞쪽)
const SIDES = { front: { r: [1, 0], f: [0, 1] }, plaque: { r: [0, -1], f: [1, 0] }, right: { r: [0, 1], f: [-1, 0] }, back: { r: [-1, 0], f: [0, -1] } };
let side = store.get('side', 'plaque');
if (!SIDES[side]) side = 'plaque';
$('side').value = side;
$('side').addEventListener('change', e => { side = e.target.value; store.set('side', side); if (navigator.vibrate) navigator.vibrate(30); });
// 실제 미로에서 확인: 두 축이 모두 반대로 움직여서 뒤집음 (-1). 다시 반대가 되면 1로 바꾸면 됩니다.
const AXIS_FLIP = -1;
const toBoard = ([r, f]) => { const S = SIDES[side], k = AXIS_FLIP; return [k * (r * S.r[0] + f * S.f[0]), k * (r * S.r[1] + f * S.f[1])]; };
const toMine = ([x, y]) => { const S = SIDES[side], k = AXIS_FLIP; return [k * (x * S.r[0] + y * S.r[1]), k * (x * S.f[0] + y * S.f[1])]; };

// ===== 버튼 =====
$('btnZero').addEventListener('click', () => {
  if (!raw) return;
  zero = raw.slice(); store.set('zero', zero);
  if (navigator.vibrate) navigator.vibrate(40);
});
$('btnPause').addEventListener('click', () => {
  paused = !paused; $('btnPause').setAttribute('aria-pressed', paused); $('btnPause').textContent = paused ? '다시 조종' : '일시정지';
});
$('sens').addEventListener('input', e => { sens = +e.target.value; $('sensO').textContent = sens.toFixed(2) + '×'; store.set('sens', sens); });

// ===== 블루투스 =====
const HELP = '목록에 <b>TiltMaze</b>가 안 보이면 차례로 확인하세요.<ol>'
  + '<li>미로 ESP32가 켜져 있고, 시리얼 모니터(115200)에 <b>블루투스 이름: TiltMaze-…</b> 줄이 나오는지 (안 나오면 블루투스 들어간 펌웨어를 다시 올리기)</li>'
  + '<li>폰의 <b>블루투스</b>와 <b>위치</b>가 모두 켜져 있는지, 크롬에 <b>근처 기기</b>(또는 위치) 권한이 허용돼 있는지</li>'
  + '<li>폰 <b>설정 → 블루투스</b>에서 TiltMaze를 직접 페어링하지 않았는지 (했다면 \'등록 해제\')</li>'
  + '<li>다른 폰이나 탭이 이미 연결돼 있지 않은지 (미로는 한 번에 한 대만 연결됩니다)</li>'
  + '<li>미로 ESP32의 <b>EN(리셋)</b> 버튼을 한 번 누르고 다시 찾기</li></ol>'
  + '아래 <b>주변 기기 전부 보기</b>로 이름 없이도 찾아볼 수 있습니다.';
let userClosed = false, retryTimer = null, retries = 0;
const MAX_RETRY = 20;
// 고른 기기에 GATT 연결 + 특성 가져오기 (처음 연결과 자동 재연결이 같이 씀)
async function attach() {
  const server = await device.gatt.connect();
  let svc;
  try { svc = await server.getPrimaryService(SERVICE); }
  catch (e) { device.gatt.disconnect(); const er = new Error('이 기기에는 미로 서비스가 없습니다. 다른 기기를 골랐거나, 미로 ESP32에 블루투스(USE_BLE 1) 펌웨어가 올라가 있지 않습니다.'); er.noService = true; throw er; }
  tiltChar = await svc.getCharacteristic(TILT);
  try {
    const st = await svc.getCharacteristic(STATUS);
    st.addEventListener('characteristicvaluechanged', e => {
      const d = e.target.value;
      if (d.byteLength >= 4) { board = [d.getInt16(0, true) / 100, d.getInt16(2, true) / 100]; boardAt = performance.now(); }
    });
    await st.startNotifications();
  } catch (e) { /* 상태 알림이 없어도 조종은 됨 */ }
  retries = 0; lastSent = null;
  chip(device.name || '연결됨', 'on');
  $('btnConnect').textContent = '연결 끊기';
  $('btnConnect').classList.remove('primary');
  say(''); $('btnScanAll').hidden = true;
  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  keepAwake();
}
async function connect(all) {
  if (device && (device.gatt.connected || retryTimer)) {          // 연결 끊기 (자동 재연결도 멈춤)
    userClosed = true; clearTimeout(retryTimer); retryTimer = null;
    if (device.gatt.connected) device.gatt.disconnect(); else onDisconnected();
    return;
  }
  if (!hasBLE) return;
  try {
    chip('찾는 중…');
    const d = await navigator.bluetooth.requestDevice(all === true
      ? { acceptAllDevices: true, optionalServices: [SERVICE] }
      : { filters: [{ namePrefix: 'TiltMaze' }, { services: [SERVICE] }], optionalServices: [SERVICE] });
    if (device && device !== d) device.removeEventListener('gattserverdisconnected', onDisconnected);
    device = d; userClosed = false;
    device.addEventListener('gattserverdisconnected', onDisconnected);
    chip('연결 중…');
    await attach();
  } catch (e) {
    tiltChar = null;
    if (e && e.name === 'NotFoundError') { chip('연결 안 됨'); say(HELP); $('btnScanAll').hidden = false; }
    else { chip('연결 실패', 'warn'); say('연결하지 못했습니다. 미로 전원이 켜져 있는지, 다른 폰이 이미 연결돼 있지 않은지 확인하세요.' + (e && e.message ? '<br><small>' + e.message + '</small>' : '')); }
  }
}
function onDisconnected() {
  tiltChar = null; board = null;
  if (userClosed || !device) {
    chip('연결 안 됨');
    $('btnConnect').textContent = '미로 연결 (블루투스)'; $('btnConnect').classList.add('primary');
    return;
  }
  // 예상치 못한 끊김 → 목록 없이 같은 미로에 자동으로 다시 연결
  $('btnConnect').textContent = '연결 끊기'; $('btnConnect').classList.remove('primary');
  scheduleRetry();
}
function scheduleRetry() {
  clearTimeout(retryTimer);
  if (retries >= MAX_RETRY) {
    retryTimer = null;
    chip('연결 끊김', 'warn');
    say('미로와 다시 연결하지 못했습니다. 미로 전원과 거리를 확인한 뒤 <b>미로 다시 연결</b>을 누르세요.');
    $('btnConnect').textContent = '미로 다시 연결'; $('btnConnect').classList.add('primary');
    return;
  }
  retries++;
  chip('다시 연결 중… ' + retries, 'warn');
  retryTimer = setTimeout(async () => {
    retryTimer = null;
    if (userClosed || !device) return;
    if (document.visibilityState !== 'visible') { scheduleRetry(); retries--; return; }  // 화면이 꺼져 있으면 켜질 때까지 대기
    try { await attach(); }
    catch (e) { if (e && e.noService) { userClosed = true; onDisconnected(); say(e.message); } else scheduleRetry(); }
  }, Math.min(500 * retries, 3000));
}
$('btnConnect').addEventListener('click', () => connect(false));
$('btnScanAll').addEventListener('click', () => connect(true));

// 손이 가만히 있으면 덜 보내서 무선 혼잡을 줄임 (최소 5번/초는 계속 보내 연결 확인)
let lastSent = null, lastSentAt = 0;
async function send() {
  if (!tiltChar || writing) return;
  const [r, f] = toBoard(current());          // 서 있는 곳 기준 → 미로판 기준
  const v = [Math.round(r * 100), Math.round(f * 100), paused ? 1 : 0];
  const now = performance.now();
  const same = lastSent && Math.abs(v[0] - lastSent[0]) < 5 && Math.abs(v[1] - lastSent[1]) < 5 && v[2] === lastSent[2];
  if (same && now - lastSentAt < 200) return;
  const buf = new DataView(new ArrayBuffer(5));
  buf.setInt16(0, v[0], true);
  buf.setInt16(2, v[1], true);
  buf.setUint8(4, v[2]);
  writing = true;
  try {
    if (tiltChar.writeValueWithoutResponse) await tiltChar.writeValueWithoutResponse(buf.buffer);
    else await tiltChar.writeValue(buf.buffer);
    sentCount++; lastSent = v; lastSentAt = now;
  } catch (e) { /* 한 번 놓쳐도 다음 주기에 다시 보냄 */ }
  writing = false;
}
setInterval(send, 1000 / SEND_HZ);

// 화면 꺼짐 방지 (크롬은 화면이 꺼지거나 다른 앱으로 가면 블루투스를 끊습니다)
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (tiltChar) keepAwake();
  else if (device && !userClosed && !device.gatt.connected && !retryTimer) { retries = 0; scheduleRetry(); }
});

// ===== 기록 (시작·도착 버튼, 사이트 순위: 파이어베이스 Firestore) =====
const DB = 'https://firestore.googleapis.com/v1/projects/tilt-maze-66507/databases/(default)/documents';
const COL = 'tiltmaze_real_records';
const fmt = t => { const m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); };
let runState = 'idle', runT0 = 0, runT = 0, countTimer = null, lastId = store.get('lastRecId', null);
let myBest = store.get('myBest', null);
function showBest() { $('best').textContent = myBest ? '내 최고 ' + fmt(myBest) : '기록 재기: 출발점에 구슬을 놓고 시작'; }
showBest();
function setRunBtn() {
  const b = $('btnRun');
  b.className = runState === 'run' ? 'finish' : 'go';
  b.textContent = runState === 'run' ? '🏁 도착!' : runState === 'count' ? '취소' : '▶ 시작';
  $('clock').classList.toggle('going', runState === 'run');
}
$('btnRun').addEventListener('click', () => {
  if (runState === 'idle') {
    if (!tiltChar) say('미로에 연결되지 않았습니다. 먼저 <b>미로 연결</b>을 눌러 주세요. (연결 없이도 시간은 잴 수 있습니다)');
    runState = 'count'; setRunBtn();
    let n = 3; const c = $('count'); c.textContent = n; c.hidden = false; if (navigator.vibrate) navigator.vibrate(60);
    countTimer = setInterval(() => {
      n--;
      if (n > 0) { c.textContent = n; if (navigator.vibrate) navigator.vibrate(60); return; }
      clearInterval(countTimer); c.textContent = '출발!'; if (navigator.vibrate) navigator.vibrate(250);
      setTimeout(() => { c.hidden = true; }, 600);
      runState = 'run'; runT0 = performance.now(); setRunBtn();
    }, 1000);
  } else if (runState === 'count') {
    clearInterval(countTimer); $('count').hidden = true; runState = 'idle'; setRunBtn();
  } else if (runState === 'run') {
    runT = (performance.now() - runT0) / 1000; runState = 'idle'; setRunBtn();
    $('clock').firstChild.nodeValue = fmt(runT);
    if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 120]);
    openSave();
  }
});
function openSave() {
  $('saveTime').textContent = fmt(runT);
  const better = !myBest || runT < myBest;
  $('saveInfo').textContent = better ? (myBest ? '내 최고 기록을 ' + (myBest - runT).toFixed(1) + '초 줄였습니다! ' : '') + '별명을 적고 저장하면 사이트 순위에 올라갑니다.' : '내 최고 ' + fmt(myBest) + '. 별명을 적고 저장하면 사이트 순위에 올라갑니다.';
  if (better) { myBest = runT; store.set('myBest', myBest); showBest(); }
  $('nick').value = store.get('nick', '');
  $('saveSheet').hidden = false;
}
const cleanNick = s => (s || '').normalize('NFC').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 10);
async function fsAdd(rec) {
  const r = await fetch(DB + '/' + COL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: {
    name: { stringValue: rec.name }, time: { doubleValue: rec.time }, device: { stringValue: rec.device.slice(0, 24) }, createdAt: { timestampValue: new Date().toISOString() } } }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).name.split('/').pop();
}
async function fsTop(n) {
  const r = await fetch(DB + ':runQuery', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ structuredQuery: { from: [{ collectionId: COL }], orderBy: [{ field: { fieldPath: 'time' }, direction: 'ASCENDING' }], limit: n } }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).filter(x => x && x.document).map(x => { const f = x.document.fields || {};
    return { id: x.document.name.split('/').pop(), name: (f.name && f.name.stringValue) || '?', time: +((f.time && (f.time.doubleValue ?? f.time.integerValue)) || 0),
             date: (() => { const d = new Date((f.createdAt && f.createdAt.timestampValue) || 0); return isNaN(d) || !d.getTime() ? '' : (d.getMonth() + 1) + '/' + d.getDate(); })() }; });
}
async function fsRank(t) {      // 나보다 빠른 기록 수 + 1, 전체 수
  const q = (filter) => fetch(DB + ':runAggregationQuery', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ structuredAggregationQuery: { structuredQuery: Object.assign({ from: [{ collectionId: COL }] }, filter ? { where: filter } : {}), aggregations: [{ alias: 'n', count: {} }] } }) })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))).then(j => +j[0].result.aggregateFields.n.integerValue);
  const [faster, total] = await Promise.all([q({ fieldFilter: { field: { fieldPath: 'time' }, op: 'LESS_THAN', value: { doubleValue: t } } }), q(null)]);
  return { rank: faster + 1, total };
}
$('saveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = cleanNick($('nick').value);
  if (!name) { $('nick').focus(); return; }
  store.set('nick', name);
  $('btnSave').disabled = true; $('btnSave').textContent = '저장 중…';
  try {
    const id = await fsAdd({ name, time: Math.round(runT * 10) / 10, device: (device && device.name) || '' });
    lastId = id; store.set('lastRecId', id);
    $('saveSheet').hidden = true;
    let msg = '';
    try { const r = await fsRank(Math.round(runT * 10) / 10); msg = '전체 ' + r.total + '개 기록 중 <b>' + r.rank + '위</b>입니다.'; } catch (x) {}
    openRanks(msg);
  } catch (err) {
    $('saveInfo').textContent = '저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. (' + err.message + ')';
  }
  $('btnSave').disabled = false; $('btnSave').textContent = '기록 저장';
});
$('btnNoSave').addEventListener('click', () => { $('saveSheet').hidden = true; });
async function openRanks(note) {
  $('rankSheet').hidden = false;
  $('rankInfo').innerHTML = (note ? note + ' ' : '') + '불러오는 중…';
  const ol = $('rankList'); ol.innerHTML = '';
  try {
    const list = await fsTop(20);
    $('rankInfo').innerHTML = (note ? note + ' ' : '') + '빠른 순서 20위까지' + (myBest ? ' · 내 최고 ' + fmt(myBest) : '');
    if (!list.length) ol.innerHTML = '<li class="empty">아직 기록이 없습니다. 첫 기록의 주인공이 되어 보세요!</li>';
    for (const r of list) {
      const li = document.createElement('li'); if (r.id === lastId) li.className = 'me';
      const n = document.createElement('span'); n.textContent = r.name;
      const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(r.time);
      const d = document.createElement('span'); d.className = 'd'; d.textContent = r.date;
      li.append(n, t, d); ol.appendChild(li);
    }
  } catch (err) { $('rankInfo').textContent = '순위를 불러오지 못했습니다. 인터넷 연결을 확인하세요. (' + err.message + ')'; }
}
$('btnRank').addEventListener('click', () => openRanks(''));
$('btnRankClose').addEventListener('click', () => { $('rankSheet').hidden = true; });
setInterval(() => { if (runState === 'run') $('clock').firstChild.nodeValue = fmt((performance.now() - runT0) / 1000); }, 50);

// ===== 화면 =====
const ball = $('ball'), real = $('real');
function draw() {
  const [r, f] = current();
  let x = r / VIEW_RANGE, y = f / VIEW_RANGE;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  ball.style.left = (42 + x * 42) + '%'; ball.style.top = (42 - y * 42) + '%';
  ball.classList.toggle('max', l >= 1);
  $('rR').textContent = (r >= 0 ? '+' : '') + r.toFixed(1) + '°';
  $('rF').textContent = (f >= 0 ? '+' : '') + f.toFixed(1) + '°';
  const fresh = board && performance.now() - boardAt < 600;
  real.classList.toggle('show', !!fresh);
  if (fresh) {
    const mb = toMine(board);                  // 미로판 기울기를 내 쪽 기준으로
    const bx = Math.max(-1, Math.min(1, mb[0] / 8)), by = Math.max(-1, Math.min(1, mb[1] / 8));
    real.style.left = (45.5 + bx * 45.5) + '%'; real.style.top = (45.5 - by * 45.5) + '%';
    $('rB').textContent = '판 ' + mb[0].toFixed(1) + '° / ' + mb[1].toFixed(1) + '°';
  } else $('rB').textContent = '판 —';
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
